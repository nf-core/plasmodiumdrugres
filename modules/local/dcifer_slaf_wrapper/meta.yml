name: dcifer_slaf_wrapper
description: Estimate single-locus allele frequencies with dcifer
keywords:
  - dcifer
  - allele frequency
  - slaf
tools:
  - dcifer:
      description: |
        Wrapper around the dcifer R package for SLAF estimation from allele tables.
      homepage: https://github.com/bahlolab/dcifer
      documentation: https://plasmogenepi.github.io/PGEcore/reference/dcifer_slaf_wrapper.html
      licence: ["MIT"]
input:
  - allele_table:
      type: file
      description: Allele / amino-acid call table (TSV)
      pattern: "*"
output:
  - mhaps_slaf:
      - "${allele_table.getBaseName(3)}.mhaps_slaf.tsv":
          type: file
          description: dcifer single-locus allele frequency table
          pattern: "${allele_table.getBaseName(3)}.mhaps_slaf.tsv"
  - versions:
      - versions.yml:
          type: file
          description: Software versions
          pattern: versions.yml
authors:
  - "@PlasmoGenEpi"
maintainers:
  - "@PlasmoGenEpi"
