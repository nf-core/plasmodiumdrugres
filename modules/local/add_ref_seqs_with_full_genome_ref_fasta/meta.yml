name: add_ref_seqs_with_full_genome_ref_fasta
description: Add reference sequences to a panel BED using a full genome FASTA
keywords:
  - reference
  - bed
  - fasta
  - biostrings
tools:
  - add_ref_seqs_with_full_genome_ref_fasta:
      description: |
        PGEcore R script that extracts sequences from a genome FASTA into a BED table.
      homepage: https://github.com/PlasmoGenEpi/plasmodiumdrugres
      documentation: https://plasmogenepi.github.io/PGEcore/reference/add_ref_seqs_with_full_genome_ref_fasta.html
      licence: ["MIT"]
input:
  - ref_bed:
      type: file
      description: Panel BED without sequences
      pattern: "*"
  - genome:
      type: file
      description: Full genome FASTA
      pattern: "*"
output:
  - ref_bed_with_seqs:
      - ref_bed_with_seqs.bed:
          type: file
          description: BED with reference sequence column
          pattern: ref_bed_with_seqs.bed
  - versions:
      - versions.yml:
          type: file
          description: Software versions
          pattern: versions.yml
authors:
  - "@PlasmoGenEpi"
maintainers:
  - "@PlasmoGenEpi"
