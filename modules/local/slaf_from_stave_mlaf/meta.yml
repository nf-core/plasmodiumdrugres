name: slaf_from_stave_mlaf
description: Derive single-locus allele frequencies from stave MLAF tables
keywords:
  - slaf
  - mlaf
  - stave
  - variantstring
tools:
  - slaf_from_stave_mlaf:
      description: |
        PGEcore R script that converts stave MLAF output to SLAF tables.
      homepage: https://github.com/PlasmoGenEpi/plasmodiumdrugres
      documentation: https://github.com/PlasmoGenEpi/PGEcore/tree/develop/scripts/slaf_from_stave_mlaf
      licence: ["MIT"]
input:
  - mlaf_base:
      type: string
      description: Base name / stub for the MLAF input group
  - mlaf_input:
      type: file
      description: Multilocus allele frequency table (TSV)
      pattern: "*"
output:
  - slaf:
      - "${mlaf_input.getBaseName(3)}.aa_sl_from_ml.tsv":
          type: file
          description: Single-locus allele frequencies derived from MLAF
          pattern: "${mlaf_input.getBaseName(3)}.aa_sl_from_ml.tsv"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: versions.yml
authors:
  - "@PlasmoGenEpi"
maintainers:
  - "@PlasmoGenEpi"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/variantstring:baf88b1c56575a41
      build_id: bd-baf88b1c56575a41_1
      scan_id: sc-537aa174a86d0f0d_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/variantstring:43bf268eba967f23
      build_id: bd-43bf268eba967f23_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/81/81b920f9fbdfb306833b8fb40a0613cc6ab2ceb9ed5f185957da55b00e4d5281/data
  conda:
    linux/amd64:
      lock_file: modules/local/slaf_from_stave_mlaf/.conda-lock/linux_amd64-bd-baf88b1c56575a41_1.txt
