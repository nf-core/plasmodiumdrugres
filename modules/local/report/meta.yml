name: report
description: |
  Render an HTML report of sanity-check and results plots from pipeline
  summary tables and amino acid calls.
keywords:
  - report
  - plot
  - visualisation
  - html
tools:
  - report:
      description: |
        R Markdown report with ggplot2 / plotly figures for locus coverage,
        coverage by population, unassigned specimens, allele prevalence and
        frequency, multi-locus haplotype composition, and SLAF vs SL-from-ML
        consistency.
      homepage: https://github.com/PlasmoGenEpi/plasmodiumdrugres
      documentation: https://github.com/PlasmoGenEpi/plasmodiumdrugres
      licence: ["MIT"]
input:
  - sl_summary:
      type: file
      description: Standardised single-locus summary TSV
      pattern: sl_summary.tsv
  - ml_summary:
      type: file
      description: Standardised multi-locus summary TSV
      pattern: ml_summary.tsv
  - raw_summaries:
      type: directory
      description: Directory containing raw_sl_from_ml_summary.tsv
      pattern: raw_summaries
  - loci_coverage:
      type: file
      description: Locus coverage table from translate_loci_of_interest
      pattern: loci_covered_by_target_samples_info.tsv
  - aa_calls:
      type: file
      description: Collapsed amino acid calls
      pattern: "*.tsv.gz"
  - report_templates:
      type: directory
      description: R Markdown templates (report.Rmd and child documents)
      pattern: "*"
  - unassigned_specimens:
      type: file
      description: Specimens with no population assignment (may be empty)
      pattern: "*.txt"
  - population_assignment:
      type: file
      description: Specimen-to-population TSV (header-only when unused)
      pattern: "*.tsv"
output:
  - report:
      - plasmodiumdrugres_report.html:
          type: file
          description: Self-contained HTML report, published at the top of the output directory
          pattern: plasmodiumdrugres_report.html
  - figures:
      - "figures/*":
          type: file
          description: Static PNG figures (only when interactive rendering is off)
          pattern: figures/*
  - versions:
      - versions.yml:
          type: file
          description: Software versions
          pattern: versions.yml
authors:
  - "@PlasmoGenEpi"
maintainers:
  - "@PlasmoGenEpi"
