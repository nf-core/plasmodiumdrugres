name: split_allele_table_by_population
description: Split allele tables by population assignment
keywords:
  - split
  - population
  - allele table
tools:
  - split_allele_table_by_population:
      description: |
        R script that writes per-population allele tables.
      homepage: https://github.com/PlasmoGenEpi/plasmodiumdrugres
      documentation: https://github.com/PlasmoGenEpi/plasmodiumdrugres
      licence: ["MIT"]
input:
  - allele_table:
      type: file
      description: Allele table TSV
      pattern: "*"
  - population_map:
      type: file
      description: Indexed population assignment TSV
      pattern: "*"
output:
  - per_pop_tables:
      - "*.allele_table.tsv.gz":
          type: file
          description: Per-population allele tables
          pattern: "*.allele_table.tsv.gz"
  - unmapped_report:
      - unmapped_identifers.txt:
          type: file
          description: Optional list of specimens not in the population map
          pattern: unmapped_identifers.txt
  - versions:
      - versions.yml:
          type: file
          description: Software versions
          pattern: versions.yml
authors:
  - "@PlasmoGenEpi"
maintainers:
  - "@PlasmoGenEpi"
