name: estimate_multilocus_prevfreq_naive
description: Naive multilocus prevalence and frequency estimation
keywords:
  - multilocus
  - mlaf
  - naive
  - prevalence
tools:
  - estimate_multilocus_prevfreq_naive:
      description: |
        PGEcore R script for naive multilocus allele frequency / prevalence.
      homepage: https://github.com/PlasmoGenEpi/plasmodiumdrugres
      documentation: https://plasmogenepi.github.io/PGEcore/reference/multilocus_prevfreq_naive.html
      licence: ["MIT"]
input:
  - aa_calls:
      type: file
      description: Amino acid call table (TSV)
      pattern: "*"
  - loci_groups:
      type: file
      description: Loci group definition table (TSV)
      pattern: "*"
  - method:
      type: string
      description: Estimation method (e.g. read_count_prop or presence_absence)
output:
  - mlaf:
      - "${aa_calls.getBaseName(3)}.aa_mlaf.tsv":
          type: file
          description: Naive multilocus allele frequency table
          pattern: "${aa_calls.getBaseName(3)}.aa_mlaf.tsv"
  - slaf_from_mlaf:
      - "${aa_calls.getBaseName(3)}.aa_sl_from_ml.tsv":
          type: file
          description: Single-locus frequencies derived from the MLAF table
          pattern: "${aa_calls.getBaseName(3)}.aa_sl_from_ml.tsv"
  - versions:
      - versions.yml:
          type: file
          description: Software versions
          pattern: versions.yml
authors:
  - "@PlasmoGenEpi"
maintainers:
  - "@PlasmoGenEpi"
