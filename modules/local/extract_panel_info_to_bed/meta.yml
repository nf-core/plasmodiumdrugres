name: extract_panel_info_to_bed
description: Extract panel insert locations from a PMO to BED
keywords:
  - pmo
  - pmotools
  - bed
  - panel
tools:
  - pmotools:
      description: |
        pmotools-python extract_insert_of_panels CLI.
      homepage: https://github.com/PlasmoGenEpi/pmotools-python
      documentation: https://github.com/PlasmoGenEpi/pmotools-python
      licence: ["MIT"]
input:
  - pmo:
      type: file
      description: PMO JSON file
      pattern: "*.json"
  - add_ref_seqs:
      type: string
      description: Whether to include reference sequences (TRUE/FALSE)
output:
  - panel_info_bed:
      - panel_info.bed:
          type: file
          description: Panel insert BED
          pattern: panel_info.bed
  - versions:
      - versions.yml:
          type: file
          description: Software versions
          pattern: versions.yml
authors:
  - "@PlasmoGenEpi"
maintainers:
  - "@PlasmoGenEpi"
