name: estimate_allele_prevalence_naive
description: Naive allele prevalence estimation
keywords:
  - prevalence
  - naive
  - allele
tools:
  - estimate_allele_prevalence_naive:
      description: |
        PGEcore R script for naive allele prevalence from amino acid calls.
      homepage: https://github.com/PlasmoGenEpi/plasmodiumdrugres
      documentation: https://github.com/PlasmoGenEpi/PGEcore/tree/develop/scripts/estimate_allele_prevalence_naive
      licence: ["MIT"]
input:
  - aa_calls:
      type: file
      description: Amino acid call table (TSV)
      pattern: "*"
output:
  - allele_prevalence:
      - "${aa_calls.getBaseName(3)}.allele_prev.tsv":
          type: file
          description: Naive allele prevalence table
          pattern: "${aa_calls.getBaseName(3)}.allele_prev.tsv"
  - versions:
      - versions.yml:
          type: file
          description: Software versions
          pattern: versions.yml
authors:
  - "@PlasmoGenEpi"
maintainers:
  - "@PlasmoGenEpi"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/pgecore_r:b3d363b44f3cab5e
      build_id: bd-b3d363b44f3cab5e_1
      scan_id: sc-0e17c1447f1a6df7_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/pgecore_r:ecb4612379d466a9
      build_id: bd-ecb4612379d466a9_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/b8/b8b5976e182bb3b8f3b3073fe7ccb663bfa240ef8476d59faf2cccf8b180fe6f/data
  conda:
