name: slaf_from_mhaps_freqs
description: Derive single-locus allele frequencies from microhaplotype frequency tables
keywords:
  - slaf
  - microhaplotype
  - mhaps
tools:
  - slaf_from_mhaps_freqs:
      description: |
        PGEcore R script that expands microhap frequencies to single-locus frequencies.
      homepage: https://github.com/PlasmoGenEpi/plasmodiumdrugres
      documentation: https://plasmogenepi.github.io/PGEcore/reference/slaf_from_mhaps_freqs.html
      licence: ["MIT"]
input:
  - group_name:
      type: string
      description: Population or analysis group label
  - mhaps_slaf_fnp:
      type: file
      description: Microhaplotype single-locus allele frequency table (TSV)
      pattern: "*"
  - loci_of_interest_per_microhaps_fnp:
      type: file
      description: Mapping of loci of interest to covering microhaplotypes (TSV)
      pattern: "*"
output:
  - slaf:
      - "${group_name}.slaf.tsv":
          type: file
          description: Derived single-locus allele frequency table
          pattern: "${group_name}.slaf.tsv"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: versions.yml
authors:
  - "@PlasmoGenEpi"
maintainers:
  - "@PlasmoGenEpi"
