name: index_population_assignment
description: Add stable internal indices to population assignment labels
keywords:
  - population
  - index
  - assignment
tools:
  - index_population_assignment:
      description: |
        R script that maps population labels to stable indices for parallel processing.
      homepage: https://github.com/PlasmoGenEpi/plasmodiumdrugres
      documentation: https://github.com/PlasmoGenEpi/plasmodiumdrugres
      licence: ["MIT"]
input:
  - population_map:
      type: file
      description: Specimen population assignment TSV
      pattern: "*"
output:
  - population_map_indexed:
      - population_map_indexed.tsv:
          type: file
          description: Population map with stable index column
          pattern: population_map_indexed.tsv
  - population_index_lookup:
      - population_index_lookup.tsv:
          type: file
          description: Index to true population label lookup
          pattern: population_index_lookup.tsv
  - versions:
      - versions.yml:
          type: file
          description: Software versions
          pattern: versions.yml
authors:
  - "@PlasmoGenEpi"
maintainers:
  - "@PlasmoGenEpi"
