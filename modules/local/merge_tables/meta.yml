name: merge_tables
description: Merge prevalence and frequency tables for a population into summary outputs
keywords:
  - merge
  - summary
  - population
tools:
  - merge_tables:
      description: |
        R helpers that attach population labels and produce SL/ML summary tables.
      homepage: https://github.com/PlasmoGenEpi/plasmodiumdrugres
      documentation: https://github.com/PlasmoGenEpi/plasmodiumdrugres
      licence: ["MIT"]
input:
  - pop_index:
      type: string
      description: Population index key for this group
  - pop_files:
      type: file
      description: Grouped prev/mlaf/slaf/sl_from_ml tables for one population
      pattern: "*"
  - population_index_lookup:
      type: file
      description: Lookup of index to true population label (may be empty)
      pattern: "*"
output:
  - sl_summary:
      - "${pop_index}.sl_summary.tsv":
          type: file
          description: Single-locus summary for the population
          pattern: "${pop_index}.sl_summary.tsv"
  - ml_summary:
      - "${pop_index}.ml_summary.tsv":
          type: file
          description: Multilocus summary for the population
          pattern: "${pop_index}.ml_summary.tsv"
  - sl_from_ml_summary:
      - "${pop_index}.sl_from_ml_summary.tsv":
          type: file
          description: SL-from-ML summary for the population
          pattern: "${pop_index}.sl_from_ml_summary.tsv"
  - versions:
      - versions.yml:
          type: file
          description: Software versions
          pattern: versions.yml
authors:
  - "@PlasmoGenEpi"
maintainers:
  - "@PlasmoGenEpi"
